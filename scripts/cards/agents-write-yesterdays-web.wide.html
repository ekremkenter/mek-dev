<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:B;src:url({{fontsource}}-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2);font-weight:200 800}
@font-face{font-family:P;src:url({{fontsource}}-variable/public-sans/files/public-sans-latin-wght-normal.woff2);font-weight:100 900}
@font-face{font-family:M;src:url({{fontsource}}/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2)}
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;background:#f6f8f7;overflow:hidden}
body{display:flex;align-items:center;padding:0 56px 0 72px;gap:40px;font-family:P;color:#17211f}
.l{flex:1}
.bar{width:56px;height:4px;background:#0e7a6e;border-radius:2px;margin-bottom:28px}
.eye{font-family:M;font-size:22px;letter-spacing:4px;color:#0b5f56}
h1{font-family:B;font-weight:700;font-size:66px;line-height:1.06;margin:26px 0 20px;letter-spacing:-0.5px}
.sub{font-size:25px;line-height:1.38;color:#4e5f5b;max-width:470px}
.by{margin-top:30px;font-size:24px;color:#4e5f5b}
.card{width:560px;border:2px solid #8b9994;border-radius:18px;background:#fdfefe;padding:28px 32px}
.head{display:grid;grid-template-columns:1fr 40px 1fr;font-family:M;font-size:17px;letter-spacing:2.5px;color:#64716d;padding-bottom:16px;border-bottom:2px solid #dbe3e0}
.row{display:grid;grid-template-columns:1fr 40px 1fr;align-items:center;padding:20px 0;border-bottom:1px solid #dbe3e0}
.row:last-child{border-bottom:0;padding-bottom:4px}
.old{font-size:21px;color:#4e5f5b;line-height:1.3}
.arr{color:#0e7a6e;font-size:26px;text-align:center}
.new{font-family:M;font-size:20px;color:#0b5f56;line-height:1.35}
</style></head><body>
<div class="l"><div class="bar"></div><div class="eye">NOTE · MEK.DEV</div><h1>Agents Write Yesterday's Web</h1><div class="sub">Why browser makers now hand coding agents current guidance</div><div class="by">Mustafa Ekrem Kenter</div></div>
<div class="card">
<div class="head"><span>YESTERDAY</span><span></span><span>TODAY</span></div>
<div class="row"><div class="old">A modal built from divs</div><div class="arr">→</div><div class="new">&lt;dialog&gt;</div></div>
<div class="row"><div class="old">A tooltip positioned by a script</div><div class="arr">→</div><div class="new">popover +<br>anchor positioning</div></div>
<div class="row"><div class="old">Dark mode set by JavaScript</div><div class="arr">→</div><div class="new">color-scheme +<br>light-dark()</div></div>
</div></body></html>
