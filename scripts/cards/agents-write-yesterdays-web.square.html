<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:B;src:url({{fontsource}}-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2);font-weight:200 800}
@font-face{font-family:P;src:url({{fontsource}}-variable/public-sans/files/public-sans-latin-wght-normal.woff2);font-weight:100 900}
@font-face{font-family:M;src:url({{fontsource}}/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2)}
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:1200px;overflow:hidden}
body{background:#0e1514;color:#e3ece9;font-family:P;padding:92px 96px;display:flex;flex-direction:column}
.eye{font-family:M;font-size:26px;letter-spacing:5px;color:#46c2b1}
h1{font-family:B;font-weight:750;font-size:112px;line-height:1.0;letter-spacing:-2px;margin-top:40px}
h1 .old{color:#f2b84b}
.rows{margin-top:72px;border-top:2px solid #253230}
.row{display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;padding:30px 0;border-bottom:2px solid #253230}
.ask{grid-column:1/-1;font-size:24px;color:#7d8f8a;margin-bottom:12px}
.y{font-family:M;font-size:34px;color:#f2b84b;text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:rgba(242,184,75,.75)}
.a{font-size:40px;color:#46c2b1;text-align:center}
.t{font-family:M;font-size:34px;color:#74d6c8}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-size:26px;color:#a0b2ad}
.foot b{color:#e3ece9;font-weight:600}
</style></head><body>
<div class="eye">MEK.DEV · NOTE</div>
<h1>Your coding agent writes <span class="old">yesterday's</span> web.</h1>
<div class="rows">
<div class="row"><div class="ask">Ask for a modal</div><div class="y">&lt;div class="modal"&gt;</div><div class="a">→</div><div class="t">&lt;dialog&gt;</div></div>
<div class="row"><div class="ask">Ask for a tooltip</div><div class="y">positionTooltip()</div><div class="a">→</div><div class="t">popover + anchor</div></div>
<div class="row"><div class="ask">Ask for dark mode</div><div class="y">toggleDarkClass()</div><div class="a">→</div><div class="t">light-dark()</div></div>
</div>
<div class="foot"><div>Hand the agent what<br>browsers already know.</div><div style="text-align:right"><b>Mustafa Ekrem Kenter</b><br>mek.dev</div></div>
</body></html>
