<svg class="fig hero-art" viewBox="0 30 1000 440" role="img" aria-labelledby="hero-title hero-desc" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="hero-title">The 23:40 moment</title>
  <desc id="hero-desc">A departure board shows the 23:40 flight to Toronto cancelled. In a chat, the passenger writes "Get me to Toronto by tomorrow night." At 23:41 an assistant replies: "Done. 07:15 tomorrow, seat 24A, hotel booked."</desc>
  <!-- departure board, dark in both themes -->
  <rect class="board" x="30" y="70" width="500" height="360" rx="14"/>
  <g class="mono board-dim" font-size="17" letter-spacing="2.7">
    <text x="60" y="122">TIME</text>
    <text x="180" y="122">DESTINATION</text>
    <text x="500" y="122" text-anchor="end">STATUS</text>
  </g>
  <line class="board-rule" x1="50" y1="142" x2="510" y2="142"/>
  <g class="mono board-text" font-size="30">
    <text class="board-time" x="60" y="203">23:05</text>
    <text x="180" y="203">NEW YORK</text>
    <text x="500" y="203" text-anchor="end">BOARDING</text>
  </g>
  <line class="board-rule" x1="50" y1="238" x2="510" y2="238"/>
  <rect class="board-alert-row" x="44" y="246" width="472" height="72" rx="8"/>
  <g class="mono" font-size="30">
    <text class="board-time" x="60" y="293">23:40</text>
    <text class="board-time" x="180" y="293">TORONTO</text>
    <text class="board-alert" x="500" y="293" text-anchor="end" font-weight="500">CANCELLED</text>
  </g>
  <line class="board-rule" x1="50" y1="326" x2="510" y2="326"/>
  <g class="mono board-text" font-size="30">
    <text class="board-time" x="60" y="387">23:55</text>
    <text x="180" y="387">SINGAPORE</text>
    <text x="500" y="387" text-anchor="end">ON TIME</text>
  </g>
  <!-- the passenger asks; an assistant answers a minute later -->
  <rect class="bubble-out" x="678" y="88" width="292" height="112" rx="22"/>
  <g class="bubble-out-text" font-size="28">
    <text x="702" y="134">Get me to Toronto</text>
    <text x="702" y="172">by tomorrow night.</text>
  </g>
  <text class="mono fig-faint" x="970" y="232" text-anchor="end" font-size="17">23:40</text>
  <rect class="bubble-in" x="560" y="262" width="353" height="112" rx="22"/>
  <g class="fig-ink" font-size="28">
    <text x="584" y="308">Done. 07:15 tomorrow,</text>
    <text x="584" y="346">seat 24A, hotel booked.</text>
  </g>
  <text class="mono fig-faint" x="560" y="406" font-size="17">23:41</text>
</svg>
